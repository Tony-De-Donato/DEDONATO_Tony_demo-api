services:
  api:
    build: ./api
    environment:
      PORT: ${API_INTERNAL_PORT:-3000}
      VERSION: ${API_VERSION:-1.0.0}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-demo}
      PGDATABASE: ${POSTGRES_DB:-demo}
      PGPASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "${API_PORT:-8080}:${API_INTERNAL_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  db_password:
    environment: DB_PASSWORD
