name: CI

on:
  push:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: api/Dockerfile.multi
          - service: notifier
            dockerfile: notifier/Dockerfile
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prefixe d'image en minuscules (pour GHCR)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login GHCR (tags seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ci

      - name: Scan Trivy ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:ci
          format: table
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: vuln
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}

      - name: Push ${{ matrix.service }} (tags seulement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}

  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.ref_name }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer un fake runner
        run: |
          docker compose pull
          docker compose up -d

      - name: Vérifier que l'api est prête et notifier actif
#       ci dessous fait par IA
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ready; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ready
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"Test CI","price_cents":100}' http://localhost:8080/products
          sleep 2
          docker compose logs notifier | grep "nouveau produit"

      - name: Afficher l'état de la stack simulée
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 50

      - name: Arrêter la stack simulée
        if: always()
        run: docker compose down -v
